name: Monitor approved disbursements

on:
  schedule:
    - cron: "*/10 8-17 * * 1-5"
      timezone: "America/New_York"
    - cron: "0 18 * * 1-5"
      timezone: "America/New_York"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zengine-disbursement-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check required secrets
        env:
          ZENGINE_API_TOKEN: ${{ secrets.ZENGINE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=0
          for name in ZENGINE_API_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run monitor
        env:
          ZENGINE_API_TOKEN: ${{ secrets.ZENGINE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_actions_monitor.py

      - name: Commit monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notified_records.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update disbursement monitor state"
            git pull --rebase
            git push
          fi
