name: Monitor approved disbursements

on:
  schedule:
    - cron: "3-59/10 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zengine-disbursement-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check scheduled business hours
        id: business_hours
        if: ${{ github.event_name == 'schedule' }}
        env:
          TZ: America/New_York
        run: |
          hour="$(date +%H)"
          minute="$(date +%M)"
          hour_num=$((10#$hour))
          minute_num=$((10#$minute))
          if (( hour_num < 8 || hour_num > 18 || (hour_num == 18 && minute_num > 9) )); then
            echo "run_monitor=false" >> "$GITHUB_OUTPUT"
            echo "Outside Eastern business hours ($hour:$minute). Skipping monitor."
          else
            echo "run_monitor=true" >> "$GITHUB_OUTPUT"
            echo "Inside Eastern business hours ($hour:$minute). Running monitor."
          fi

      - name: Checkout repository
        if: ${{ github.event_name != 'schedule' || steps.business_hours.outputs.run_monitor == 'true' }}
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        if: ${{ github.event_name != 'schedule' || steps.business_hours.outputs.run_monitor == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ github.event_name != 'schedule' || steps.business_hours.outputs.run_monitor == 'true' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check required secrets
        if: ${{ github.event_name != 'schedule' || steps.business_hours.outputs.run_monitor == 'true' }}
        env:
          ZENGINE_LOGIN_EMAIL: ${{ secrets.ZENGINE_LOGIN_EMAIL }}
          ZENGINE_LOGIN_PASSWORD: ${{ secrets.ZENGINE_LOGIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=0
          for name in ZENGINE_LOGIN_EMAIL ZENGINE_LOGIN_PASSWORD TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required repository secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Run monitor
        if: ${{ github.event_name != 'schedule' || steps.business_hours.outputs.run_monitor == 'true' }}
        env:
          ZENGINE_LOGIN_EMAIL: ${{ secrets.ZENGINE_LOGIN_EMAIL }}
          ZENGINE_LOGIN_PASSWORD: ${{ secrets.ZENGINE_LOGIN_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_NO_CHANGES_MESSAGE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "Running Zengine approved-disbursement monitor..."
          python github_actions_monitor.py

      - name: Commit monitor state
        if: ${{ github.event_name != 'schedule' || steps.business_hours.outputs.run_monitor == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/notified_records.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update disbursement monitor state"
            git pull --rebase
            git push
          fi
