services:
  - type: web
    name: zengine-disbursement-monitor
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zengine-disbursement-monitor-db
          property: connectionString
      - key: ZENGINE_FORM_ID
        value: "185672"
      - key: ZENGINE_APPROVED_VALUE
        value: "Approved"
      - key: ZENGINE_AMOUNT_FIELD_ID
        value: field3583325
      - key: ZENGINE_LINKED_PAYEE_FIELD_ID
        value: field3588097
      - key: ZENGINE_STATUS_FIELD_ID
        value: field3589680
      - key: ZENGINE_PAYMENT_MEMO_FIELD_ID
        value: field6995603
      - key: ZENGINE_SORT_FIELD
        value: modified
      - key: CHECK_INTERVAL_MINUTES
        value: "10"
      - key: NOTIFY_EXISTING_ON_FIRST_RUN
        value: "false"
      - key: RUN_ON_STARTUP
        value: "true"
      - key: RUN_ONCE_SECRET
        generateValue: true
      - key: ZENGINE_API_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

databases:
  - name: zengine-disbursement-monitor-db
    plan: basic-256mb
